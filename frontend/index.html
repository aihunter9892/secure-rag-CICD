<!DOCTYPE html>
<html>
<head>
    <title>Tata Harrier</title>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<div class="app">

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">
            🚗 Tata Harrier AI by Hitesh Motwani
        </div>
        <button class="new-chat" onclick="newChat()">+ New Chat</button>
    </div>

    <!-- Main Chat Area -->
    <div class="chat-area">

        <div class="messages" id="messages">
            <div class="message assistant">
                Hello! I’m your Tata Harrier assistant. Ask me anything about the vehicle.
            </div>
        </div>

        <div class="input-area">
            <textarea id="question" placeholder="Send a message..." rows="1"></textarea>
            <button onclick="askQuestion()">➤</button>
        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
